<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dancing Car</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 65%, #334155 65%, #1e293b 100%);
      color: #f8fafc;
      overflow-x: hidden;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 1px;
    }

    .stage {
      position: relative;
      width: 360px;
      height: 210px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .road {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 24px;
      background: #090d16;
      border-top: 3px dashed #facc15;
      border-radius: 6px;
    }

    .car {
      position: relative;
      bottom: 20px;
      width: 230px;
      height: 105px;
      transform-origin: bottom center;
      transition: transform 0.2s ease;
    }

    .car.dancing {
      animation: danceBody 0.6s infinite ease-in-out;
    }

    .car-top {
      position: absolute;
      top: 6px;
      left: 42px;
      width: 126px;
      height: 46px;
      background: #ef4444;
      border-radius: 18px 24px 4px 4px;
      border: 3px solid #991b1b;
      display: flex;
      gap: 8px;
      padding: 6px;
    }

    .window {
      flex: 1;
      background: #bae6fd;
      border-radius: 8px;
      border: 2px solid #0f172a;
    }

    .car-body {
      position: absolute;
      bottom: 18px;
      width: 100%;
      height: 48px;
      background: #dc2626;
      border-radius: 14px 20px 10px 10px;
      border: 3px solid #991b1b;
    }

    .headlight {
      position: absolute;
      right: 6px;
      top: 12px;
      width: 18px;
      height: 12px;
      background: #fef08a;
      border-radius: 4px;
      box-shadow: 0 0 8px rgba(254, 240, 138, 0.5);
    }

    .car.dancing .headlight {
      animation: flashLights 0.3s infinite alternate;
    }

    .wheel {
      position: absolute;
      bottom: 0;
      width: 40px;
      height: 40px;
      background: #111827;
      border: 5px solid #9ca3af;
      border-radius: 50%;
    }

    .wheel.front {
      right: 28px;
    }

    .wheel.back {
      left: 28px;
    }

    .car.dancing .wheel {
      animation: spinWheel 0.5s infinite linear;
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    button {
      padding: 12px 22px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      background: #22c55e;
      color: #052e16;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: #4ade80;
    }

    @keyframes danceBody {
      0%, 100% {
        transform: translateY(0) rotate(0deg) scaleX(1);
      }
      25% {
        transform: translateY(-18px) rotate(-7deg) scaleX(1.04);
      }
      50% {
        transform: translateY(-4px) rotate(0deg) scaleX(0.97);
      }
      75% {
        transform: translateY(-18px) rotate(7deg) scaleX(1.04);
      }
    }

    @keyframes spinWheel {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes flashLights {
      from {
        background: #fef08a;
        box-shadow: 0 0 12px #fef08a;
      }
      to {
        background: #38bdf8;
        box-shadow: 0 0 18px #38bdf8;
      }
    }
  </style>
</head>
<body>
  <h1>Dancing Car</h1>

  <div class="stage">
    <div class="car" id="car">
      <div class="car-top">
        <div class="window"></div>
        <div class="window"></div>
      </div>
      <div class="car-body">
        <div class="headlight"></div>
      </div>
      <div class="wheel back"></div>
      <div class="wheel front"></div>
    </div>
    <div class="road"></div>
  </div>

  <div class="controls">
    <button id="toggleBtn" type="button">Start Dancing</button>
  </div>

  <script>
    const car = document.getElementById("car");
    const toggleBtn = document.getElementById("toggleBtn");
    let isDancing = false;

    toggleBtn.addEventListener("click", () => {
      isDancing = !isDancing;
      car.classList.toggle("dancing", isDancing);
      toggleBtn.textContent = isDancing ? "Stop Dancing" : "Start Dancing";
    });
  </script>
</body>
</html>
